<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - City Assessor Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0c0a09;
            color: #f8fafc;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #1c1917;
            border: 1px solid #292524;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            object-fit: contain;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #34d399;
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 700;
        }
        p {
            margin: 0 0 24px;
            font-size: 14px;
            line-height: 1.5;
            color: #a8a29e;
        }
        button {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: #059669;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/pwa/icon-192.png" alt="FairTrack Logo" class="icon" />
        <div class="badge">Offline Mode</div>
        <h1>You are currently offline</h1>
        <p>City Assessor Portal could not reach the server. Check your network or office LAN connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
